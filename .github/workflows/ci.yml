name: CI

on:
  push:
    branches: ["**"]
  pull_request:
    branches: ["**"]

permissions:
  contents: read

jobs:
  # Build the library against every target framework it ships for.
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        tfm: [net10.0, net9.0, net8.0, netstandard2.0]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore
        run: dotnet restore src/NfsSharp.csproj

      - name: Build (${{ matrix.tfm }})
        run: dotnet build src/NfsSharp.csproj -c Release --no-restore --framework ${{ matrix.tfm }}

  # Run the test suite. The test project targets net10.0.
  test:
    runs-on: ubuntu-latest
    needs: build

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: |
            10.0.x
            9.0.x

      - name: Restore
        run: dotnet restore

      - name: Build
        run: dotnet build -c Release --no-restore

      - name: Test (net10.0)
        run: dotnet test tests/NfsSharp.Tests/NfsSharp.Tests.csproj -c Release --no-build --framework net10.0 --collect:"XPlat Code Coverage"
